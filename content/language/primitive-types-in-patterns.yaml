oldCode: |-
  String classify(int code) {
      if (code >= 200 && code < 300)
          return "success";
      else if (code >= 400 && code < 500)
          return "client error";
      else
          return "other";
  }
modernCode: |-
  String classify(int code) {
      return switch (code) {
          case int c when c >= 200
              && c < 300 -> "success";
          case int c when c >= 400
              && c < 500 -> "client error";
          default -> "other";
      };
  }
summary: "Pattern matching now works with primitive types, not just objects."
