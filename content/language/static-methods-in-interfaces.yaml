oldCode: |-
  // Separate utility class needed
  public class ValidatorUtils {
      public static boolean isBlank(
          String s) {
          return s == null ||
                 s.trim().isEmpty();
      }
  }

  // Usage
  if (ValidatorUtils.isBlank(input)) { ... }
modernCode: |-
  public interface Validator {
      boolean validate(String s);

      static boolean isBlank(String s) {
          return s == null ||
                 s.trim().isEmpty();
      }
  }

  // Usage
  if (Validator.isBlank(input)) { ... }
summary: "Add static utility methods directly to interfaces instead of separate utility\
  \ classes."
explanation: "Before Java 8, utility methods related to an interface had to live in\
  \ a separate class (e.g., Collections for Collection). Static methods in interfaces\
  \ let you keep related utilities together. Common in modern APIs like Comparator.comparing(),\
  \ Stream.of(), and List.of()."
whyModernWins:
- icon: "📦"
