oldCode: |-
  String msg;
  switch (day) {
      case MONDAY:
          msg = "Start";
          break;
      case FRIDAY:
          msg = "End";
          break;
      default:
          msg = "Mid";
  }
modernCode: |-
  String msg = switch (day) {
      case MONDAY  -> "Start";
      case FRIDAY  -> "End";
      default      -> "Mid";
  };
