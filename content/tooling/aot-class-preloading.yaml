modernCode: |-
  // Training run:
  $ java -XX:AOTCacheOutput=app.aot \
      -cp app.jar com.App
  // Production:
  $ java -XX:AOTCache=app.aot \
      -cp app.jar com.App
summary: "Cache class loading and compilation for instant startup."
explanation: "AOT class preloading caches loaded and linked classes from a training\
  \ run. On subsequent starts, classes are loaded from the cache, skipping verification\
  \ and linking. Combined with AOT compilation, this dramatically reduces startup\
  \ time."
