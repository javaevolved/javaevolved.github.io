jdkVersion: "11"
oldLabel: "Java EE"
modernLabel: "Jakarta EE 10+"
oldApproach: "@ManagedBean"
modernApproach: "@Named + CDI"
oldCode: |-
  @ManagedBean
  @SessionScoped
  public class UserBean implements Serializable {
      @ManagedProperty("#{userService}")
      private UserService userService;

      private String name;

      public String getName() { return name; }
      public void setName(String name) {
          this.name = name;
      }

      public void setUserService(UserService svc) {
          this.userService = svc;
      }
  }
modernCode: |-
  @Named
  @SessionScoped
  public class UserBean implements Serializable {
      @Inject
      private UserService userService;

      private String name;

      public String getName() { return name; }
      public void setName(String name) {
          this.name = name;
      }
  }
summary: "Replace deprecated JSF @ManagedBean with CDI @Named for a unified dependency\
  \ injection model."
explanation: "JSF's @ManagedBean and @ManagedProperty were deprecated in Jakarta Faces\
  \ 2.3 and removed in Jakarta EE 10. The CDI-based replacement uses @Named to expose\
  \ the bean to EL expressions and @Inject for dependency wiring. This unifies the\
  \ bean model: JSF pages, JAX-RS resources, and EJBs all share the same CDI container."
whyModernWins:
- icon: "🔗"
  title: "Unified model"
  desc: "One CDI container manages all beans — JSF, REST, and service layers share\
    \ the same injection."
- icon: "🗑️"
  title: "Less boilerplate"
  desc: "@Inject replaces @ManagedProperty and its required setter method."
- icon: "🔮"
  title: "Future-proof"
  desc: "@ManagedBean is removed in Jakarta EE 10; @Named is the supported replacement."
support:
