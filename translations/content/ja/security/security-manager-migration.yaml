title: "SecurityManagerチェックから明示的な認可へ"
oldApproach: "SecurityManagerによるチェック"
modernApproach: "明示的な認可"
summary: "無効化されたSecurityManagerチェックを、アプリケーションによる明示的な認可とデプロイ環境での分離に置き換えます。"
explanation: "JEP 486によりJDK 24でSecurity Managerが恒久的に無効化されたため、System.getSecurityManager()を介したチェックでポリシーを適用できるのはJDK 23以前のみです。アプリケーションはドメインロジックでアクセスを明示的に認可する必要があります。信頼できないユーザーがそのツリーを同時に変更できない場合、ファイルシステム上の実際のパスを解決することで、既存のシンボリックリンクが許可されたルートの外へ抜け出すことを防げます。攻撃者が書き込み可能なツリーでは、SecureDirectoryStreamのような競合状態に強いハンドル相対アクセスを使用してください。分離には、プロセス、コンテナ、またはオペレーティングシステムの境界を使用してください。JDK 24では非推奨のAPIが一時的に残されていますが、有効化することはできず、別のプロセス内サンドボックスにも置き換えられていません。"
whyModernWins:
- icon: "🔍"
  title: "明示的なポリシー"
  desc: "認可がアプリケーションロジック内で可視化され、テスト可能になります。"
- icon: "🛡️"
  title: "実効性のある分離"
  desc: "プロセス、コンテナ、オペレーティングシステムの境界がアプリケーション全体を保護します。"
- icon: "🚫"
  title: "必須の移行"
  desc: "JDK 24以降ではポリシーを適用できなくなったチェックを削除します。"
support:
  description: "JEP 486によってSecurity Managerが恒久的に無効化されるJDK 24以降では必須です。"
