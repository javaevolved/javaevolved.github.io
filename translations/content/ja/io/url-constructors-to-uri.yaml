title: 非推奨のURLコンストラクターからURIへ
oldApproach: URLの直接生成
modernApproach: URIからURLへ変換
summary: "リソース識別子をURI値として解析・構成し、必要な場合にのみURLへ変換する。"
explanation: "URLの解析と等価性にはプロトコルハンドラーに起因する予想外の動作があるため、URLコンストラクターはJDK 20で非推奨になりました。解析、構成、比較、正規化には、不変な表現であるURIが推奨されます。URLを要求するAPIでのみ変換してください。"
