- icon: "👁"
  title: レビューが容易
  desc: "ソートキーと優先順位が明確になります。"
- icon: "🐛"
  title: より安全な比較
  desc: "専用ヘルパーにより、誤りやすい算術演算によるComparatorを回避できます。"
