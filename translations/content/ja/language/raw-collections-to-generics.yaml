---
title: 生のコレクションからジェネリック型へ
oldApproach: 生のコレクション
modernApproach: ジェネリックコレクション
summary: 生のコレクション型と取得時のキャストを、コンパイル時のジェネリック型安全性に置き換えます。
explanation: "生のコレクションは任意のオブジェクト型を受け入れ、型エラーはキャストが実行されるまで先延ばしにされます。ジェネリック型引数を使うことで、\
  \ コンパイラが書き込みと読み取りを検証し、キャストが不要になり、IDEの支援が向上し、API契約が明示的になります。生の型は通常、慎重に切り離された\
  \ レガシーとの相互運用境界にのみ残すべきです。"
whyModernWins:
- icon: 🔒
  title: コンパイル時の安全性
  desc: 不正な要素型は実行時ではなくコンパイル時に検出されます。
- icon: 🧹
  title: 取得時のキャストが不要
  desc: 値は宣言された要素型を保持します。
- icon: 📖
  title: 自己文書化されたAPI
  desc: コレクション宣言が、含まれる内容を正確に示します。
support:
  description: ジェネリックはJDK 5(2004年9月)以降利用可能です。
