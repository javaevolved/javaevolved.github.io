title: 匿名クラスからラムダ式とメソッド参照へ
oldApproach: 匿名クラス
modernApproach: メソッド参照
summary: "単一メソッドの匿名クラスを簡潔なラムダ式とメソッド参照に置き換える。"
explanation: "関数型インターフェースはラムダ式またはメソッド参照で実装できます。静的型付けと同じコールバック契約を維持しながら、匿名クラスに伴う定型コードを削減できます。"
whyModernWins:
- icon: "⚡"
  title: 少ない定型コード
  desc: "クラス宣言とオーバーライドに伴う定型コードを削減できます。"
- icon: "👁"
  title: 優れた可読性
  desc: "実行する操作に注意を集中できます。"
- icon: "🔒"
  title: 引き続き型安全
  desc: "コンパイラーが対象となる関数型インターフェースのシグネチャを検査します。"
support:
  description: "JDK 8（2014年3月）以降、利用可能"
