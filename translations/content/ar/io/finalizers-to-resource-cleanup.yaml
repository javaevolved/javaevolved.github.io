title: "من المنهيات إلى التنظيف الحتمي للموارد"
oldApproach: "تجاوز finalize()"
modernApproach: "AutoCloseable و Cleaner"
summary: "استبدل الإنهاء بـ AutoCloseable واستخدم Cleaner فقط كحل احتياطي دفاعي."
explanation: "الإنهاء مهمل تمهيداً للإزالة، ولا يوفّر تنظيفاً فورياً ولا ترتيباً موثوقاً. طبّق AutoCloseable لتمكين المستدعين من تحرير الموارد بصورة حتمية باستخدام try-with-resources. أما الموارد المتسرّبة، فيمكن لـ Cleaner استدعاء عملية التنظيف عديمة التأثير عند تكرارها نفسها كحل أخير؛ ويجب ألا تحتفظ هذه العملية بالكائن المسجّل."
whyModernWins:
- icon: "⏱"
  title: "حتمي"
  desc: "يحرّر try-with-resources الموارد عند نقطة معروفة."
- icon: "🛡"
  title: "دورة حياة أكثر أماناً"
  desc: "يتجنب إحياء الكائنات بواسطة المنهيات والترتيب غير المتوقع."
- icon: "🧹"
  title: "حل احتياطي دفاعي"
  desc: "يمكن لـ Cleaner استعادة الموارد المتسرّبة دون تجاوز finalize()."
support:
  description: "يتوفر Cleaner وإهمال الإنهاء منذ JDK 9 (سبتمبر 2017)"
