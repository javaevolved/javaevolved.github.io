title: "من فحوصات SecurityManager إلى التخويل الصريح"
oldApproach: "فحوصات SecurityManager"
modernApproach: "التخويل الصريح"
summary: "استبدل فحوصات SecurityManager المعطّلة بتخويل صريح داخل التطبيق وعزل على مستوى النشر."
explanation: "عطّل JEP 486 مدير الأمان نهائياً في JDK 24، لذلك لا يمكن للفحوصات عبر System.getSecurityManager() فرض السياسات إلا في JDK 23 والإصدارات الأقدم. يجب على التطبيقات تخويل الوصول صراحةً في منطق المجال؛ ويمنع تحليل مسارات نظام الملفات الحقيقية الروابط الرمزية الموجودة من تجاوز جذر مسموح به عندما يتعذر على المستخدمين غير الموثوق بهم تعديل شجرة الملفات بالتزامن. أما أشجار الملفات التي يمكن للمهاجم الكتابة فيها، فاستخدم معها وصولاً نسبياً إلى المقبض ومقاوماً لسباقات التزامن، مثل SecureDirectoryStream. استخدم حدود العمليات أو الحاويات أو نظام التشغيل للعزل. يحتفظ JDK 24 مؤقتاً بواجهة API المهملة، لكن لا يمكن تمكينها ولم يُستعَض عنها ببيئة اختبار معزولة أخرى داخل العملية."
whyModernWins:
- icon: "🔍"
  title: "سياسة صريحة"
  desc: "يكون التخويل واضحاً وقابلاً للاختبار في منطق التطبيق."
- icon: "🛡️"
  title: "عزل حقيقي"
  desc: "تحمي حدود العمليات والحاويات ونظام التشغيل التطبيق بأكمله."
- icon: "🚫"
  title: "ترحيل مطلوب"
  desc: "يزيل الفحوصات التي لم تعد قادرة على فرض السياسات في JDK 24 والإصدارات الأحدث."
support:
  description: "مطلوب في JDK 24 والإصدارات الأحدث، حيث يعطّل JEP 486 مدير الأمان نهائياً."
