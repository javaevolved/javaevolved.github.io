  desc: "يتجنب فئات تطبيق sun.misc التي لا يمكن الوصول إليها."
- icon: "🧩"
  title: "متغيرات متكاملة"
  desc: "يشمل مرمّزات ومفككات ترميز أساسية وآمنة لعناوين URL ومتوافقة مع MIME."
- icon: "🚀"
  title: "لا تبعية"
