title: "ترميز Base64 القياسي وفك ترميزه"
oldApproach: "مرمّز sun.misc"
modernApproach: "واجهة Base64 البرمجية القياسية"
summary: "استخدم java.util.Base64 بدلاً من فئات JDK الداخلية أو برامج الترميز الخارجية."
explanation: "توفر واجهة Base64 البرمجية القياسية مرمّزات ومفككات ترميز أساسية وآمنة لعناوين URL ومتوافقة مع MIME، دون الاعتماد على حزم داخلية غير مدعومة. استخدم getEncoder() و getDecoder() لـ Base64 القياسي، أو اختر متغيرات URL وMIME عندما يتطلبها التنسيق المستهدف."
whyModernWins:
