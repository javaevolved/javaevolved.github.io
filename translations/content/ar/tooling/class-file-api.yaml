- icon: "📦"
  title: "تبعيات أقل"
  desc: "تعالج مهام الشيفرة البايتية الشائعة دون مكتبة خارجية."
- icon: "🧩"
  title: "نماذج قابلة للتركيب"
  desc: "يشترك التحليل والبناء والتحويل في واجهة برمجية واحدة."
