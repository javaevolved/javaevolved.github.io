title: "تحديثات ذرّية للخرائط باستخدام compute و merge"
oldApproach: "get() + فحص null + put()"
modernApproach: "computeIfAbsent()"
summary: "استبدل البحث متعدد الخطوات في الخريطة وتعديلها بـ computeIfAbsent() و compute() و merge()."
explanation: "تجمع دوال الحساب في Map قصد البحث والتحديث في عملية واحدة. استخدم computeIfAbsent() للتهيئة الكسولة، و compute() عندما تعتمد القيمة الجديدة على القيمة الموجودة، و merge() لدمج قيمة مقدّمة مع قيمة موجودة في الخريطة. وفي تطبيقات الخرائط المتزامنة، تتجنب العمليات الحسابية المدعومة أيضاً حالات التسابق الناتجة عن استدعاءات get() و put() المنفصلة."
whyModernWins:
- icon: "⚡"
  title: "عمليات بحث أقل"
  desc: "يتجنب الوصول المتكرر إلى المفتاح."
- icon: "🧵"
  title: "دلالات تزامن أفضل"
  desc: "يمكن للخرائط المتزامنة تنفيذ التحديثات المدعومة بصورة ذرّية."
- icon: "👁"
  title: "قصد واضح"
  desc: "تظهر قاعدة التهيئة بجوار عملية الوصول."
support:
  description: "متاح على نطاق واسع منذ JDK 8 (مارس 2014)"
