title: "Von SecurityManager-Prüfungen zu expliziter Autorisierung"
oldApproach: "SecurityManager-Prüfungen"
modernApproach: "Explizite Autorisierung"
summary: "Ersetzen Sie deaktivierte SecurityManager-Prüfungen durch explizite Anwendungsautorisierung und Isolierung bei der Bereitstellung."
explanation: "JEP 486 hat den Security Manager in JDK 24 dauerhaft deaktiviert. Daher können Prüfungen über System.getSecurityManager() nur unter JDK 23 und älter Richtlinien durchsetzen. Anwendungen müssen den Zugriff explizit in der Domänenlogik autorisieren; das Auflösen tatsächlicher Dateisystempfade verhindert, dass vorhandene symbolische Links aus einem zulässigen Stammverzeichnis ausbrechen, sofern nicht vertrauenswürdige Benutzer diesen Verzeichnisbaum nicht gleichzeitig verändern können. Verwenden Sie für Verzeichnisbäume, in die Angreifer schreiben können, einen gegen Wettlaufsituationen geschützten, handle-relativen Zugriff wie SecureDirectoryStream. Nutzen Sie zur Isolierung Prozess-, Container- oder Betriebssystemgrenzen. JDK 24 behält die veraltete API vorübergehend bei, sie kann jedoch nicht aktiviert werden und wird nicht durch eine andere prozessinterne Sandbox ersetzt."
whyModernWins:
- icon: "🔍"
  title: "Explizite Richtlinie"
  desc: "Die Autorisierung ist in der Anwendungslogik sichtbar und testbar."
- icon: "🛡️"
  title: "Echte Isolierung"
  desc: "Prozess-, Container- und Betriebssystemgrenzen schützen die gesamte Anwendung."
- icon: "🚫"
  title: "Erforderliche Migration"
  desc: "Entfernt Prüfungen, die unter JDK 24 und neuer keine Richtlinien mehr durchsetzen können."
support:
  description: "Erforderlich unter JDK 24 und neuer, wo JEP 486 den Security Manager dauerhaft deaktiviert."
