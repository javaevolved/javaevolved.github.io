title: "Ленивый анализ стека с помощью StackWalker"
oldApproach: "Thread.getStackTrace()"
modernApproach: "StackWalker"
summary: "Анализируйте кадры стека лениво с помощью StackWalker вместо создания полной трассировки стека."
explanation: "StackWalker предоставляет ленивый поток кадров стека и настраиваемый доступ к сохранённым ссылкам на классы. Код может остановиться сразу после нахождения нужного кадра, не выделяя память под весь массив трассировки стека."
whyModernWins:
- icon: "⚡"
  title: "Ленивый обход"
  desc: "Посещает только те кадры, которые нужны операции."
- icon: "🧩"
  title: "Удобная работа с потоками"
  desc: "Для фильтрации и выбора используются стандартные операции Stream API."
- icon: "🎛"
  title: "Настраиваемость"
  desc: "Параметры обеспечивают доступ к ссылкам на классы, скрытым и рефлексивным кадрам."
support:
  description: "Широко доступно начиная с JDK 9 (сентябрь 2017)"
