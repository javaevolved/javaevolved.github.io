title: От Class.newInstance() к рефлексии конструктора
oldApproach: Class.newInstance()
modernApproach: Явный поиск конструктора
summary: Замените устаревший Class.newInstance() явным поиском и вызовом конструктора.
explanation: Class.newInstance() признан устаревшим, поскольку позволяет обойти проверку
  во время компиляции исключений, выбрасываемых конструктором, и поддерживает только
  конструктор без аргументов. Явный поиск Constructor делает выбранную сигнатуру видимой
  и сообщает об ошибках рефлексивного вызова с помощью соответствующих исключений рефлексии.
  Правила модулей и доступа продолжают действовать; этот шаблон не рекомендует обходить
  инкапсуляцию.
whyModernWins:
- icon: ✅
  title: Поддерживаемый API
  desc: Устраняет использование устаревшего Class.newInstance().
- icon: 🎯
  title: Явный конструктор
  desc: Запрашиваемая сигнатура видима и может принимать аргументы.
- icon: 🛡
  title: Честные ошибки
  desc: Исключения конструктора представлены через InvocationTargetException.
support:
  description: Рекомендуется с момента признания Class.newInstance() устаревшим в JDK
    9 (сентябрь 2017 года).
