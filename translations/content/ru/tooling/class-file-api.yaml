title: "Разбор class-файлов с помощью стандартного API"
oldApproach: "ASM ClassReader"
modernApproach: "Class-File API"
summary: "Используйте стандартный Class-File API для разбора и преобразования class-файлов."
explanation: "Class-File API, окончательно утверждённый в JDK 24, предоставляет поддерживаемые модели и преобразования для class-файлов JVM. Он развивается вместе с форматом class-файлов в JDK и во многих задачах анализа и генерации устраняет необходимость в сторонних библиотеках."
whyModernWins:
- icon: "🛡"
  title: "Поддерживаемый API"
  desc: "Поставляется и развивается вместе с форматом class-файлов JDK."
- icon: "📦"
  title: "Меньше зависимостей"
  desc: "Решает распространённые задачи с байт-кодом без внешней библиотеки."
- icon: "🧩"
  title: "Компонуемые модели"
  desc: "Разбор, построение и преобразование используют единый API."
support:
  description: "Окончательно утверждено в JDK 24 (JEP 484, март 2025)."
