---
title: "От Runtime.exec(String) к аргументам ProcessBuilder"
oldApproach: "Runtime.exec(String)"
modernApproach: "ProcessBuilder"
summary: "Запускайте процессы с явным списком аргументов и настройкой ProcessBuilder."
explanation: "Runtime.exec(String) применяет разбиение командной строки Java на токены, которое легко понять неправильно, когда аргументы содержат пробелы или кавычки. ProcessBuilder принимает аргументы программы как отдельные значения и явно предоставляет рабочий каталог, окружение, перенаправления ввода-вывода и политику потока ошибок. Он не вызывает оболочку, если приложение не запускает её намеренно."
whyModernWins:
- icon: "🎯"
  title: "Точные аргументы"
  desc: "Каждый аргумент процесса остаётся отдельным значением без разбиения командной строки."
- icon: "🎛"
  title: "Явная настройка"
  desc: "Окружение, каталог, перенаправления и обработка ошибок настраиваются вместе."
- icon: "🛡"
  title: "Безопасные границы"
  desc: "Исключает сборку строки команды в стиле оболочки из динамических значений."
support:
