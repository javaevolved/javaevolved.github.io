title: "От проверок SecurityManager к явной авторизации"
oldApproach: "Проверки SecurityManager"
modernApproach: "Явная авторизация"
summary: "Замените отключённые проверки SecurityManager явной авторизацией в приложении и изоляцией на уровне развёртывания."
explanation: "JEP 486 окончательно отключил Security Manager в JDK 24, поэтому проверки через System.getSecurityManager() могут обеспечивать соблюдение политик только в JDK 23 и более ранних версиях. Приложения должны явно авторизовать доступ в доменной логике; разрешение реальных путей файловой системы не позволяет существующим символическим ссылкам выйти за пределы разрешённого корневого каталога, если недоверенные пользователи не могут одновременно изменять это дерево. Для деревьев, доступных злоумышленнику на запись, используйте устойчивый к состояниям гонки доступ относительно дескриптора, например SecureDirectoryStream. Для изоляции используйте границы процессов, контейнеров или операционной системы. JDK 24 временно сохраняет устаревший API, однако его нельзя включить и он не заменён другой внутрипроцессной песочницей."
whyModernWins:
- icon: "🔍"
  title: "Явная политика"
  desc: "Авторизация видна и поддаётся тестированию в логике приложения."
- icon: "🛡️"
  title: "Настоящая изоляция"
  desc: "Границы процессов, контейнеров и операционной системы защищают всё приложение."
- icon: "🚫"
  title: "Обязательная миграция"
  desc: "Удаляет проверки, которые больше не могут обеспечивать соблюдение политик в JDK 24 и более поздних версиях."
support:
  description: "Обязательно для JDK 24 и более поздних версий, где JEP 486 окончательно отключает Security Manager."
