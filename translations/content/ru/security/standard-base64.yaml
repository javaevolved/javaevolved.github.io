title: "Стандартное кодирование и декодирование Base64"
oldApproach: "Кодировщик sun.misc"
modernApproach: "Стандартный API Base64"
summary: "Используйте java.util.Base64 вместо внутренних классов JDK или сторонних кодеков."
explanation: "Стандартный API Base64 предоставляет обычные, URL-безопасные и MIME-кодировщики и декодировщики без зависимости от неподдерживаемых внутренних пакетов. Используйте getEncoder() и getDecoder() для стандартного Base64 либо выберите варианты для URL и MIME, если этого требует целевой формат."
whyModernWins:
- icon: "🛡️"
  title: "Поддерживаемый API"
  desc: "Не использует недоступные классы реализации sun.misc."
- icon: "🧩"
  title: "Полный набор вариантов"
  desc: "Включает обычные, URL-безопасные и MIME-кодировщики и декодировщики."
- icon: "🚀"
  title: "Без зависимостей"
  desc: "Кодирование и декодирование встроены в JDK."
support:
  description: "Широко доступно начиная с JDK 8 (март 2014)."
