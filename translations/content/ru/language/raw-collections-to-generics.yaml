---
title: От сырых коллекций к обобщённым типам
oldApproach: Сырые коллекции
modernApproach: Обобщённые коллекции
summary: Замените сырые типы коллекций и приведения типов при извлечении на безопасность типов, проверяемую на этапе компиляции.
explanation: "Сырые коллекции принимают произвольные типы объектов и откладывают ошибки типов до момента выполнения\
  \ приведения типа. Параметры обобщённого типа позволяют компилятору проверять запись и чтение, устраняют приведения\
  \ типов, улучшают поддержку IDE и делают контракты API явными. Сырые типы обычно должны оставаться только на тщательно\
  \ изолированных границах взаимодействия с устаревшим кодом."
whyModernWins:
- icon: 🔒
  title: Безопасность на этапе компиляции
  desc: Недопустимые типы элементов вызывают ошибку при компиляции, а не во время выполнения.
- icon: 🧹
  title: Без приведений при извлечении
  desc: Значения сохраняют объявленный тип элемента.
- icon: 📖
  title: Самодокументируемые API
  desc: Объявления коллекций точно указывают, что они содержат.
support:
  description: Обобщённые типы доступны начиная с JDK 5 (сентябрь 2004 года).
