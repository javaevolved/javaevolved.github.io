title: "Атомарное обновление Map с помощью compute и merge"
oldApproach: "get() + проверка на null + put()"
modernApproach: "computeIfAbsent()"
summary: "Замените многоэтапный поиск и изменение Map методами computeIfAbsent(), compute() и merge()."
explanation: "Вычисляющие методы Map объединяют поиск и обновление в одной операции. Используйте computeIfAbsent() для ленивой инициализации, compute(), когда новое значение зависит от существующего, и merge(), чтобы объединить переданное значение с уже находящимся в Map. В реализациях конкурентных отображений поддерживаемые вычисления также предотвращают гонки, возникающие из-за отдельных вызовов get() и put()."
whyModernWins:
- icon: "⚡"
  title: "Меньше поисков"
  desc: "Исключает повторный доступ по ключу."
- icon: "🧵"
  title: "Улучшенная семантика конкурентности"
  desc: "Конкурентные отображения могут атомарно выполнять поддерживаемые обновления."
- icon: "👁"
  title: "Ясное намерение"
  desc: "Правило инициализации находится рядом с обращением к значению."
support:
  description: "Широко доступно начиная с JDK 8 (март 2014)"
