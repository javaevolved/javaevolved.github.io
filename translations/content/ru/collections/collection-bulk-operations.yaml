title: "Групповые операции с коллекциями вместо циклов с изменением"
oldApproach: "Ручное удаление через итератор"
modernApproach: "Collection.removeIf()"
summary: "Используйте removeIf(), replaceAll() и List.sort() для непосредственного преобразования коллекций."
explanation: "Современные интерфейсы коллекций напрямую предоставляют распространённые операции изменения. Такие методы, как removeIf(), replaceAll() и List.sort(), заменяют перегруженные управляющей логикой циклы операциями, которые явно выражают требуемое преобразование."
whyModernWins:
- icon: "👁"
  title: "Ясное намерение"
  desc: "Операция описывает, что изменяется, а не как выполнять итерацию."
- icon: "🐛"
  title: "Безопасное изменение"
  desc: "Не нужно вручную соблюдать правила удаления через итератор."
- icon: "⚡"
  title: "Меньше кода"
  desc: "Распространённые преобразования становятся одним выражением."
support:
  description: "Доступно начиная с JDK 8 (март 2014)"
