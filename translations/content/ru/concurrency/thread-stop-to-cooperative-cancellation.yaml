title: От небезопасного завершения потоков к совместной отмене
oldApproach: Thread.stop()
modernApproach: Future.cancel(true)
summary: Замените Thread.stop() и импровизированные общие флаги отменой задач с учётом прерываний.
explanation: "Thread.stop() может завершить код в тот момент, когда он владеет мониторами\
  \ или обновляет общее состояние, оставляя объекты повреждёнными. Современная отмена\
  \ является совместной: отменяйте Future с прерыванием, распространяйте InterruptedException,\
  \ где это возможно, восстанавливайте статус прерывания, когда его нельзя распространить,\
  \ и проектируйте задачу так, чтобы она достигала безопасных точек отмены."
whyModernWins:
- icon: "🛡"
  title: Сохраняет инварианты
  desc: Задачи останавливаются только в местах кода, предназначенных для отмены.
- icon: "🧩"
  title: Стандартное управление
  desc: Future представляет выполнение, завершение и отмену вместе.
- icon: "🔗"
  title: Компонуемость
  desc: Прерывание работает с блокирующими очередями, локами, executor'ами и виртуальными потоками.
support:
  description: "Future и ExecutorService доступны начиная с JDK 5 (сент. 2004)."
