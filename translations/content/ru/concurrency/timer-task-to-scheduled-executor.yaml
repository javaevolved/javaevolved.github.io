title: От задач Timer к запланированным исполнителям
oldApproach: Timer и TimerTask
modernApproach: ScheduledExecutorService
summary: Замените Timer и TimerTask на ScheduledExecutorService для надёжной запланированной
  работы.
explanation: Timer выполняет все задачи в одном потоке, поэтому одна долго выполняющаяся
  задача задерживает остальные, а необработанное исключение завершает поток таймера.
  ScheduledExecutorService использует framework executor'ов, поддерживает несколько
  воркеров, возвращает дескрипторы ScheduledFuture и предоставляет явное управление
  жизненным циклом. Владеющий компонент должен останавливать планировщик, когда он
  больше не нужен.
whyModernWins:
- icon: 🧵
  title: Лучшая изоляция
  desc: Настраиваемый пул потоков предотвращает совместное использование одного хрупкого
    воркера несвязанными задачами.
- icon: 🛡
  title: Надёжное выполнение
  desc: Сбой одной задачи не завершает работу самого планировщика.
- icon: 🎛
  title: Управляемый жизненный цикл
  desc: 'Future, отмена, задержки и завершение работы используют стандартные API
    executor''ов.'
support:
  description: Широко доступно начиная с JDK 5 (сент. 2004)
