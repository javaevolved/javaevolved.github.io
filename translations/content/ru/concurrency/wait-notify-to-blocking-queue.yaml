title: Очереди wait/notify в BlockingQueue
oldApproach: Ручные wait и notify
modernApproach: BlockingQueue
summary: Замените написанную вручную координацию производитель-потребитель на BlockingQueue.
explanation: "Корректный код wait/notify требует общего монитора, циклов проверки\
  \ условия, соответствующих уведомлений и аккуратной обработки прерываний. BlockingQueue\
  \ инкапсулирует эти правила и предоставляет блокирующие, ограниченные по времени\
  \ и неблокирующие операции для схем производитель-потребитель. Вызовы вроде put()\
  \ и take() остаются прерываемыми."
whyModernWins:
- icon: "🛡"
  title: Более безопасная координация
  desc: Очередь берёт на себя блокировку и сигнализацию условий.
- icon: "👁"
  title: Ясное намерение
  desc: put() и take() напрямую выражают поведение производитель-потребитель.
- icon: "🎛"
  title: Встроенные политики
  desc: Выбирайте ограниченную ёмкость, справедливость, тайм-ауты или неблокирующие операции.
support:
  description: Широко доступно с JDK 5 (2004)
