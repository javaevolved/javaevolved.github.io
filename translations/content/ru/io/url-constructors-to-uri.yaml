title: "От устаревших конструкторов URL к URI"
oldApproach: "Прямое создание URL"
modernApproach: "Сначала URI, затем URL"
summary: "Разбирайте и составляйте идентификаторы ресурсов как значения URI, преобразуя их в URL только при необходимости."
explanation: "Конструкторы URL были объявлены устаревшими в JDK 20, поскольку разбор и проверка равенства URL связаны с неожиданным поведением обработчиков протоколов. URI — предпочтительное неизменяемое представление для разбора, составления, сравнения и нормализации; преобразуйте его только при вызове API, которым требуется URL."
whyModernWins:
- icon: "✅"
  title: "Без устаревшего API"
  desc: "Исключает использование устаревших конструкторов URL."
- icon: "🧠"
  title: "Предсказуемая семантика"
  desc: "Сравнение URI не выполняет разрешение, зависящее от сети."
- icon: "🧩"
  title: "Удобное составление"
  desc: "URI предназначен для разбора идентификаторов и работы с ними."
support:
  description: "Конструкторы URL объявлены устаревшими начиная с JDK 20 (март 2023)"
