title: "От финализаторов к детерминированному освобождению ресурсов"
oldApproach: "Переопределение finalize()"
modernApproach: "AutoCloseable и Cleaner"
summary: "Замените финализацию на AutoCloseable, используя Cleaner только как защитный резервный механизм."
explanation: "Финализация объявлена устаревшей с намерением удаления и не обеспечивает ни своевременной очистки, ни надёжного порядка. Реализуйте AutoCloseable, чтобы вызывающий код мог детерминированно освобождать ресурсы с помощью try-with-resources. Для потерянных ресурсов Cleaner в крайнем случае может вызвать то же идемпотентное действие очистки; это действие не должно удерживать зарегистрированный объект."
whyModernWins:
- icon: "⏱"
  title: "Детерминированность"
  desc: "Try-with-resources освобождает ресурсы в известный момент."
- icon: "🛡"
  title: "Безопасный жизненный цикл"
  desc: "Исключает воскрешение финализатором и непредсказуемый порядок."
- icon: "🧹"
  title: "Защитный резервный механизм"
  desc: "Cleaner может освободить потерянные ресурсы без переопределения finalize()."
support:
  description: "Cleaner и объявление финализации устаревшей доступны начиная с JDK 9 (сентябрь 2017)"
