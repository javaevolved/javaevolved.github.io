title: "Файловый ввод-вывод с кодировкой по умолчанию на явные StandardCharsets"
oldApproach: "Кодировка платформы по умолчанию"
modernApproach: "Явная стандартная кодировка"
summary: "Используйте читатели и писатели Files с константами StandardCharsets вместо поведения кодировки платформы по умолчанию и поиска по имени кодировки."
explanation: "Конструкторы Reader и Writer, которые полагаются на кодировку по умолчанию, делают поведение файла зависимым от среды выполнения. Files.newBufferedReader() и newBufferedWriter() принимают явную Charset, а StandardCharsets предоставляет гарантированные константы, такие как UTF_8, без поиска по строке или UnsupportedCharsetException."
whyModernWins:
- icon: "🌍"
  title: "Переносимые результаты"
  desc: "Одни и те же байты декодируются одинаково на любой машине."
- icon: "🔒"
  title: "Предопределённая константа"
  desc: "StandardCharsets.UTF_8 не может содержать опечатку в имени кодировки."
- icon: "🧩"
  title: "Современный файловый API"
  desc: "Path, буферизация и кодировка выражены в одной операции."
support:
  description: "Широко доступно с JDK 7 (июль 2011)"
