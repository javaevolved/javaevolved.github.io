title: "SecurityManager পরীক্ষা থেকে স্পষ্ট অনুমোদন"
oldApproach: "SecurityManager পরীক্ষা"
modernApproach: "স্পষ্ট অনুমোদন"
summary: "নিষ্ক্রিয় SecurityManager পরীক্ষার বদলে অ্যাপ্লিকেশনে স্পষ্ট অনুমোদন এবং ডেপ্লয়মেন্ট আইসোলেশন ব্যবহার করুন।"
explanation: "JEP 486, JDK 24-এ Security Manager স্থায়ীভাবে নিষ্ক্রিয় করেছে, তাই System.getSecurityManager()-এর মাধ্যমে করা পরীক্ষা কেবল JDK 23 ও তার আগের সংস্করণে নীতি প্রয়োগ করতে পারে। অ্যাপ্লিকেশনকে ডোমেইন লজিকে স্পষ্টভাবে অ্যাক্সেস অনুমোদন করতে হবে; প্রকৃত ফাইল সিস্টেম পাথ সমাধান করলে বিদ্যমান সিম্বলিক লিঙ্ক অনুমোদিত রুটের বাইরে যেতে পারে না, যদি অবিশ্বস্ত ব্যবহারকারীরা একই সময়ে ওই ট্রি পরিবর্তন করতে না পারে। আক্রমণকারী লিখতে পারে এমন ট্রির ক্ষেত্রে SecureDirectoryStream-এর মতো রেস-প্রতিরোধী, হ্যান্ডেল-রিলেটিভ অ্যাক্সেস ব্যবহার করুন। আইসোলেশনের জন্য প্রসেস, কনটেইনার বা অপারেটিং সিস্টেমের সীমানা ব্যবহার করুন। JDK 24 সাময়িকভাবে অবচিত API-টি রেখেছে, তবে এটি সক্রিয় করা যায় না এবং এর পরিবর্তে অন্য কোনো ইন-প্রসেস স্যান্ডবক্স দেওয়া হয়নি।"
