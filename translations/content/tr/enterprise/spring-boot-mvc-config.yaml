explanation: "Spring Boot 1.x uygulamaları, Java interface'leri varsayılan metotlar sağlayamadığı için yaygın olarak WebMvcConfigurerAdapter'ı genişletirdi. Modern Spring Framework sürümleri varsayılan implementasyonları doğrudan WebMvcConfigurer üzerinde sağlar; bu nedenle interface'i uygulayın ve yalnızca ihtiyacınız olan metotları override edin. Bir Spring Boot uygulamasında MVC yapılandırmasının tüm denetimini bilinçli olarak devralmak istemediğiniz sürece @EnableWebMvc eklemeyin: Bu açıklama, olağan dönüştürücüler, statik kaynak işleme ve diğer varsayılanlar dahil Boot'un MVC otomatik yapılandırmasını devre dışı bırakır."
