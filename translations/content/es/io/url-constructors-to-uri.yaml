  desc: "Elimina el uso de constructores obsoletos de URL."
- icon: "🧠"
  title: "Semántica predecible"
  desc: "La comparación de URI no realiza resoluciones dependientes de la red."
- icon: "🧩"
  title: "Mejor composición"
  desc: "URI está diseñada para analizar y manipular identificadores."
support:
