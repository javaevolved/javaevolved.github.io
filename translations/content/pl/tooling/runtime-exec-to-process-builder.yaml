summary: "Uruchamiaj procesy z jawną listą argumentów i konfiguracją ProcessBuilder."
explanation: "Runtime.exec(String) stosuje tokenizację łańcucha polecenia w Javie, którą łatwo źle zrozumieć, gdy argumenty zawierają spacje lub cudzysłowy. ProcessBuilder przyjmuje argumenty programu jako odrębne wartości i jawnie udostępnia katalog roboczy, środowisko, przekierowania wejścia/wyjścia oraz politykę strumienia błędów. Nie uruchamia powłoki, o ile aplikacja nie zrobi tego celowo."
