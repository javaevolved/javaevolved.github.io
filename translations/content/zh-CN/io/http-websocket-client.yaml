---
title: 使用 java.net.http 的 WebSocket 客户端
oldApproach: 第三方 WebSocket 客户端
modernApproach: java.net.http.WebSocket
summary: "使用标准异步 WebSocket 客户端，无需添加第三方依赖。"
explanation: "java.net.http 包含与标准 HTTP 客户端集成的异步 WebSocket 客户端。连接通过 CompletableFuture 建立，监听器回调借助 CompletionStage 支持非阻塞消息处理，并且客户端共享 JDK 标准的代理、TLS 和执行器配置。"
